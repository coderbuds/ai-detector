tool:
  id: replit-ai
  name: Replit AI
  provider: Replit
  website: https://replit.com

explicit_markers:
  bot_authors:
    - username: 'replit[bot]'
      confidence: 100
      description: "Replit bot commit author"

    - email: 'ai@replit.com'
      confidence: 100
      description: "Replit AI bot email"

  commit_footers:
    - pattern: 'replit.com/ai'
      regex: false
      confidence: 100
      description: "Replit AI URL reference"

  html_comments:
    - pattern: '<!-- Generated by Replit AI -->'
      regex: false
      confidence: 100
      description: "Replit AI HTML comment"

  labels:
    - name: 'replit-ai'
      confidence: 90
      description: "Replit AI PR label"

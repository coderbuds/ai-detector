# OpenAI Codex Detection Rules
# Transcribed from CheckExplicitAIAttributionAction
# Last updated: 2026-09-26

tool:
  id: openai-codex
  name: OpenAI Codex
  provider: OpenAI
  variants:
    - codex
    - code-davinci-002

# Explicit markers
explicit_markers:
  # Labels and tags
  labels:
    - name: codex
      confidence: 100
      description: "PR has 'codex' label"

  # Branch naming patterns
  branch_patterns:
    - pattern: '^codex/'
      regex: true
      confidence: 90
      description: "Branch starts with codex/"

    - pattern: '^codex-'
      regex: true
      confidence: 90
      description: "Branch starts with codex-"

    - pattern: '/codex/'
      regex: true
      confidence: 85
      description: "Branch contains /codex/"

  # Codex cloud titles its pull requests "[codex] …"
  text_patterns:
    - pattern: '^\[codex\]'
      regex: true
      case_insensitive: true
      location: title
      confidence: 90
      description: "Title starts with [codex]"

  # Link back to the Codex cloud task that produced the change
  commit_footers:
    - pattern: 'chatgpt\.com/codex/(cloud/)?tasks/'
      regex: true
      confidence: 100
      description: "Link to the Codex task that opened the PR"

  # Codex names itself when it connects to an MCP server: clientInfo name
  # `codex-mcp-client` (title "Codex") and User-Agent `codex-mcp-client/<version>`,
  # per codex-rs in openai/codex. It is the only trace local Codex CLI leaves,
  # and it is not on the pull request: a consumer has to have seen a Codex
  # session act on the change, e.g. check its size just before it opened.
  mcp_clients:
    - client_name: '^codex-mcp-client$'
      confidence: 90
      description: "A Codex session worked on this change over MCP before it opened"

    - user_agent: '^codex-mcp-client/'
      confidence: 90
      description: "A Codex session (by User-Agent) worked on this change over MCP before it opened"

# Deliberately absent: bare mentions of "codex/" or "codex-" in a title or
# description. On Coderbuds' production data they matched Dependabot bumps of
# @openai/codex and `.codex/` config paths — never an agent's own pull request.
# Codex CLI run locally leaves no marker at all; nothing in this file can see it.
